name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'

jobs:
  visual-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fixture: [pwtint, dcdrentals, martinezwelding]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build test site (${{ matrix.fixture }})
        run: |
          cd /tmp
          git clone --depth 1 https://x-access-token:${{ secrets.PLATFORM_READ_TOKEN }}@github.com/ziamade/ziamade-platform.git
          cd ziamade-platform/packages/pipeline
          TEMPLATE_DIR=$GITHUB_WORKSPACE npx tsx scripts/build-from-fixture.ts ${{ matrix.fixture }}
          cd build/${{ matrix.fixture }} && npm ci && npx astro build

      - name: Run visual diff (${{ matrix.fixture }})
        run: |
          cd /tmp/ziamade-platform
          FIXTURE=${{ matrix.fixture }} npx playwright test tests/visual-regression/template-upgrade.spec.ts --reporter=list
        env:
          CI: true

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.fixture }}
          path: /tmp/ziamade-platform/test-results/
          retention-days: 7
